<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DriveSmart Academy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #2e7d32;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            color: white;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .nav-menu {
            text-align: center;
            margin: 20px 0;
        }
        .nav-menu a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 25px;
            background-color: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .nav-menu a:hover {
            background-color: #388e3c;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 5px;
            max-width: 500px;
            margin: 20px auto;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #2e7d32;
        }
        button {
            background-color: #2e7d32;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #388e3c;
        }
        .footer {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
        label {
            color: #2e7d32;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>🚗 Drive Smart Academy</h1>
</div>

<div class="container">
    <div class="nav-menu">
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Instructors</a>
        <a href="#">Schedule</a>
        <a href="#">Contact</a>
    </div>

    <form>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="course">Select Course</label>
        <select id="course">
            <option>Basic Driving</option>
            <option>City Traffic</option>
            <option>Defensive Driving</option>
            <option>Parking & Manoeuvres</option>
        </select>

        <button type="submit">Enroll</button>
        <button type="reset" style="background-color: #ccc; color: #2e7d32; margin-left: 10px;">Reset</button>
    </form>
</div>

<div class="footer">
    <p>&copy; 2026 Drive Smart Academy. All rights reserved.</p>
</div>
</body>
</html>
